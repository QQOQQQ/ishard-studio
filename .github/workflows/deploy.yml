name: 검사 및 배포

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: 코드 검사
        run: npm run check
      - name: 배포 시험(실제 배포 아님)
        run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Cloudflare 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1fbcc230bbd355b5eedc7fb5f1d776b1
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 비밀값이 없습니다. 저장소 Settings > Secrets and variables > Actions 에 등록해주세요."
            exit 1
          fi
          npx wrangler deploy --message "github ${GITHUB_SHA::7}: $(git log -1 --format=%s | head -c 80)"
