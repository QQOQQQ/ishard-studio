<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ISHARD 작업실</title>
    <style>
      :root {
        --bg: #f6f3ec;
        --fg: #2b2a26;
        --mut: #6f6b60;
        --card: #fff;
        --ln: #e3ddd0;
        --ac: #5f6849;
        --acs: #eef0e6;
        --bad: #a4402f;
        --badbg: #fbeeea;
        --warn: #8a6a1c;
        --warnbg: #fbf5e4;
        --ok: #3f6b3a;
        --okbg: #eef5ea;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1d1c19;
          --fg: #ece8dc;
          --mut: #a7a293;
          --card: #262520;
          --ln: #3a382f;
          --ac: #a5b07f;
          --acs: #2f3326;
          --bad: #e08a78;
          --badbg: #3a2621;
          --warn: #d9b867;
          --warnbg: #352d1a;
          --ok: #9cc48f;
          --okbg: #22301f;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1d1c19;
        --fg: #ece8dc;
        --mut: #a7a293;
        --card: #262520;
        --ln: #3a382f;
        --ac: #a5b07f;
        --acs: #2f3326;
        --bad: #e08a78;
        --badbg: #3a2621;
        --warn: #d9b867;
        --warnbg: #352d1a;
        --ok: #9cc48f;
        --okbg: #22301f;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.5 -apple-system,
          "Noto Sans KR",
          "Malgun Gothic",
          sans-serif;
      }
      main {
        max-width: 860px;
        margin: 0 auto;
        padding: 14px 16px 32px;
      }
      h1 {
        font-size: 18px;
        margin: 4px 0 12px;
      }
      h2 {
        font-size: 14px;
        margin: 14px 0 4px;
        color: var(--mut);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--ln);
        border-radius: 12px;
        padding: 12px;
        margin: 8px 0;
      }
      .mut {
        color: var(--mut);
        font-size: 13px;
      }
      .bad {
        color: var(--bad);
      }
      .warn {
        color: var(--warn);
        font-size: 13px;
      }
      #msg {
        background: var(--badbg);
        color: var(--bad);
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
      }
      .okm {
        background: var(--okbg);
        color: var(--ok);
        border-color: transparent;
      }
      .lock {
        color: var(--mut);
        background: transparent;
        border-style: dashed;
      }
      .warnbox {
        background: var(--warnbg);
        color: var(--warn);
        border-color: transparent;
        font-size: 13px;
      }
      button,
      select {
        font: inherit;
        border: 1px solid var(--ln);
        background: var(--card);
        color: var(--fg);
        border-radius: 8px;
        padding: 8px 12px;
        min-height: 40px;
        cursor: pointer;
      }
      button:disabled,
      input:disabled,
      textarea:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.p {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) button.p {
          color: #1d1c19;
        }
      }
      :root[data-theme="dark"] button.p {
        color: #1d1c19;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 2px;
      }
      textarea,
      input[type="text"] {
        width: 100%;
        font: inherit;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--ln);
        border-radius: 8px;
        padding: 8px;
        margin: 4px 0;
      }
      textarea {
        min-height: 90px;
        font-size: 13px;
      }
      input[type="checkbox"] {
        width: 20px;
        height: 20px;
        accent-color: var(--ac);
      }
      .tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 2px 0 6px;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tabs button {
        white-space: nowrap;
      }
      .tabs .on {
        background: var(--ac);
        color: #fff;
        border-color: var(--ac);
      }
      .tabs.top {
        margin-bottom: 8px;
      }
      .n {
        display: inline-block;
        min-width: 18px;
        padding: 0 5px;
        border-radius: 9px;
        background: var(--bad);
        color: #fff;
        font-size: 11px;
        line-height: 18px;
        text-align: center;
        margin-left: 2px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .tag {
        font-size: 12px;
        border: 1px solid var(--ln);
        border-radius: 99px;
        padding: 1px 8px;
        white-space: nowrap;
      }
      .tag.done {
        background: var(--okbg);
        color: var(--ok);
        border-color: transparent;
      }
      .tag.wait {
        color: var(--mut);
        border-style: dashed;
      }
      .tag.bad {
        color: var(--bad);
        border-color: var(--bad);
      }
      .cid {
        overflow-wrap: anywhere;
      }
      .next {
        margin: 4px 0 8px;
      }
      .hdr {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .hdr b {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .vid {
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      .ver.appr {
        border-color: var(--ac);
        box-shadow: 0 0 0 1px var(--ac) inset;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--ln);
        border-radius: 10px;
        overflow: hidden;
        margin: 6px 0;
      }
      .seg button {
        border: 0;
        border-radius: 0;
      }
      .seg .on {
        background: var(--acs);
        font-weight: 600;
      }
      .cmp {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(260px, 1fr);
        gap: 8px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        padding-bottom: 4px;
      }
      .cmp > .card {
        scroll-snap-align: start;
        margin: 0;
      }
      .cmp.two {
        grid-auto-columns: minmax(220px, 1fr);
        margin: 8px 0;
      }
      .kv {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 2px 10px;
        margin: 8px 0 0;
        font-size: 13px;
      }
      .kv dt {
        color: var(--mut);
      }
      .kv dd {
        margin: 0;
      }
      .sw {
        width: 64px;
        aspect-ratio: 9/16;
        border-radius: 8px;
        border: 2px solid var(--ln);
        display: flex;
        align-items: end;
        justify-content: center;
        font-size: 10px;
        padding: 2px;
        text-align: center;
        color: #2b2a26;
      }
      .sw.sel {
        border-color: var(--ac);
        outline: 2px solid var(--ac);
      }
      .cand {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 84px;
        align-items: stretch;
      }
      .cand button {
        white-space: nowrap;
        padding: 8px 4px;
        font-size: 14px;
      }
      .cand .sw {
        width: 84px;
      }
      .note {
        font-size: 11px;
        line-height: 1.3;
      }
      input[type="number"] {
        width: 100%;
        font: inherit;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--ln);
        border-radius: 8px;
        padding: 8px;
        margin-top: 2px;
      }
      .scores {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
        gap: 6px;
        margin-top: 8px;
        align-items: end;
      }
      .scores label,
      .ncg label {
        display: flex;
        flex-direction: column;
        font-size: 12px;
        color: var(--mut);
      }
      .ncg {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 6px 8px;
        margin: 8px 0;
      }
      .ncg .w {
        grid-column: 1/-1;
      }
      .ncg select {
        width: 100%;
      }
      .regrow {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 4px 0;
      }
      .regrow input {
        margin: 0;
      }
      .who {
        text-align: right;
        margin: -4px 0 4px;
      }
      details.ec {
        margin-top: 8px;
        font-size: 14px;
      }
      details.ec ul {
        margin: 6px 0;
        padding-left: 18px;
      }
      details.ec li {
        margin: 2px 0;
      }
      details.rv {
        margin-top: 6px;
      }
      details summary {
        cursor: pointer;
      }
      details.rv summary {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 0 12px;
        border: 1px solid var(--ln);
        border-radius: 8px;
        list-style: none;
      }
      details.rv summary::-webkit-details-marker {
        display: none;
      }
      details.rv[open] summary {
        margin-bottom: 6px;
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 2px;
      }
      .cal > div {
        min-height: 64px;
        border: 1px solid var(--ln);
        border-radius: 6px;
        padding: 2px;
        font-size: 11px;
        overflow: hidden;
        min-width: 0;
      }
      .cal .h {
        min-height: 0;
        border: 0;
        text-align: center;
        color: var(--mut);
      }
      .chip {
        display: block;
        width: 100%;
        font-size: 10px;
        min-height: 0;
        padding: 2px;
        margin-top: 2px;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chip.action {
        border-color: var(--ac);
      }
      .chip.waiting {
        border-style: dashed;
        color: var(--mut);
      }
      .tablewrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      td,
      th {
        border-bottom: 1px solid var(--ln);
        padding: 6px 4px;
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--mut);
        font-weight: 500;
      }
      td button {
        white-space: nowrap;
        padding: 8px 10px;
      }
      .sel {
        background: var(--acs);
        border-color: transparent;
      }
      .bp {
        display: grid;
        gap: 8px;
        margin-top: 8px;
      }
      .feed {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 3px;
      }
      .tile {
        aspect-ratio: 3/4;
        border-radius: 4px;
        border: 1px dashed var(--ln);
        background: var(--card);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: flex-start;
        padding: 6px;
        min-height: 0;
        color: var(--fg);
      }
      .tile span {
        font-size: 11px;
        color: var(--mut);
      }
      .tile small {
        font-size: 11px;
        background: var(--card);
        border-radius: 4px;
        padding: 1px 4px;
      }
      .logrow {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 8px;
        padding: 6px 0;
        border-bottom: 1px solid var(--ln);
        font-size: 13px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
        gap: 8px;
        margin: 4px 0 8px;
      }
      .brief h2 {
        font-size: 14px;
        margin: 14px 0 6px;
      }
      .brief .src {
        padding: 6px 0;
        border-top: 1px solid var(--ln);
      }
      .md .mdh {
        font-weight: 700;
        margin: 12px 0 4px;
      }
      .md .mdli {
        padding-left: 12px;
        text-indent: -10px;
      }
      .md .mdsp {
        height: 6px;
      }
      .report a,
      .brief a {
        color: var(--ac);
      }
      .brief ul {
        margin: 4px 0;
        padding-left: 18px;
      }
      .stats button.late {
        border-color: var(--bad);
        background: var(--badbg);
        color: var(--bad);
      }
      .stats button {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding: 10px 12px;
        min-height: 64px;
      }
      .stats b {
        font-size: 22px;
        line-height: 1.1;
      }
      .stats span {
        font-size: 12px;
        color: var(--mut);
      }
      .agenda {
        display: grid;
        grid-template-columns: 64px 1fr auto;
        gap: 8px;
        align-items: center;
        width: 100%;
        text-align: left;
        margin: 4px 0;
        padding: 10px;
      }
      .agenda .ad {
        font-size: 13px;
        color: var(--mut);
      }
      .agenda .at {
        min-width: 0;
        overflow: hidden;
      }
      .agenda small {
        display: block;
        color: var(--mut);
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .bnav,
      .sheet {
        display: none;
      }
      @media (max-width: 700px) {
        main {
          padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
        }
        .tabs.top {
          display: none;
        }
        .bnav {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 10;
          background: var(--card);
          border-top: 1px solid var(--ln);
          padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
        }
        .bnav button {
          border: 0;
          background: transparent;
          min-height: 48px;
          font-size: 14px;
          border-radius: 10px;
        }
        .bnav .on {
          background: var(--acs);
          color: var(--ac);
          font-weight: 600;
        }
        .sheet {
          display: grid;
          gap: 6px;
          position: fixed;
          left: 8px;
          right: 8px;
          bottom: calc(68px + env(safe-area-inset-bottom, 0px));
          z-index: 11;
          background: var(--card);
          border: 1px solid var(--ln);
          border-radius: 14px;
          padding: 8px;
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }
        .sheet button {
          text-align: left;
          min-height: 48px;
        }
        .cmp {
          grid-auto-columns: 86%;
        }
        .cmp.two {
          grid-auto-flow: row;
          grid-auto-columns: auto;
          overflow: visible;
        }
        .cmp.two > .card + .card {
          margin-top: 0;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script>
      (() => {
        var xe = Object.freeze({
            failure: "실패 회피형",
            statusquo: "현재 제품 유지형",
            tradeoff: "조건 충돌형",
            burden: "관리 부담형",
            proof: "근거 확인형",
            confusion: "정보 혼란형",
          }),
          it = Object.freeze(["empathy", "barrier", "reframe", "product_evidence", "decision"]),
          or = Object.freeze(["psychology", "fit", "evidence", "flow", "novelty"]),
          nr = 2e4,
          E = (e, t = 1200) => (typeof e == "string" ? e.trim().slice(0, t) : ""),
          L = (e) => e !== null && typeof e == "object" && !Array.isArray(e),
          ir = (e, t) => Object.prototype.hasOwnProperty.call(e, t);
        function at(e) {
          if (!L(e) || JSON.stringify(e).length > nr) throw Error("기획 JSON 객체 또는 20KB 이하 용량을 확인해주세요.");
          let t = e.core || {},
            r = e.persona || {},
            s = e.fit || {},
            o = e.quality || {};
          if (!L(t) || !L(r) || !L(s) || !L(o)) throw Error("기획 항목은 객체여야 합니다.");
          let n = E(r.type, 32);
          if (!ir(xe, n)) throw Error("6가지 구매심리 유형 중 하나를 선택해주세요.");
          let i = Array.isArray(e.flow) ? e.flow : [];
          if (i.length > 5 || i.some((m, f) => !L(m) || it[f] !== m.stage))
            throw Error("콘텐츠 전개는 정해진 순서의 5단계를 사용해주세요.");
          let a = {},
            c = L(o.scores) ? o.scores : {};
          for (let m of or) {
            let f = c[m] ?? 0;
            if (!Number.isInteger(f) || f < 0 || f > 20) throw Error("기획 평가는 항목별 0~20점만 가능합니다.");
            a[m] = f;
          }
          let d = E(s.verification, 32) || "pending";
          if (!["pending", "verified", "insufficient"].includes(d)) throw Error("제품 검증 상태가 올바르지 않습니다.");
          let l = E(o.claimReview, 20) || "pending",
            p = E(o.duplicateReview, 20) || "pending";
          if (!["pending", "pass", "fail"].includes(l) || !["pending", "pass", "fail"].includes(p))
            throw Error("검수 상태가 올바르지 않습니다.");
          let h = E(r.evidenceStatus, 32) || "hypothesis";
          if (!["hypothesis", "customer_data"].includes(h)) throw Error("고객 근거 구분이 잘못되었습니다.");
          return {
            version: 2,
            core: {
              objective: E(t.objective),
              purchaseQuestion: E(t.purchaseQuestion),
              barrier: E(t.barrier),
              answer: E(t.answer),
              cta: E(t.cta),
            },
            persona: {
              type: n,
              trigger: E(r.trigger),
              desired: E(r.desired),
              preserve: E(r.preserve),
              currentAlternative: E(r.currentAlternative),
              objection: E(r.objection),
              evidenceStatus: h,
            },
            fit: {
              customerCondition: E(s.customerCondition),
              productFeature: E(s.productFeature),
              selectionReason: E(s.selectionReason),
              verification: d,
              claimLimit: E(s.claimLimit),
              sourceIds: Array.isArray(s.sourceIds)
                ? s.sourceIds
                    .filter((m) => typeof m == "string")
                    .slice(0, 12)
                    .map((m) => E(m, 250))
                : [],
            },
            flow: it.map((m, f) => ({ stage: m, text: E(i[f]?.text) })),
            quality: { scores: a, claimReview: l, duplicateReview: p, humanConfirmed: o.humanConfirmed === !0 },
          };
        }
        function Oe(e, t = []) {
          if (!e) return { ready: !1, reasons: ["새 구매심리 기획이 없습니다."] };
          let r = at(e),
            s = [];
          ((!r.core.purchaseQuestion || !r.core.barrier || !r.core.answer) &&
            s.push("핵심 구매 질문·장벽·답변을 입력해주세요."),
            (!r.persona.objection || !r.persona.desired) && s.push("고객의 원하는 조건과 구매 반론을 작성해주세요."),
            (!r.fit.productFeature || !r.fit.selectionReason) &&
              s.push("아이샤드 제품 특징과 선택 이유를 작성해주세요."),
            r.fit.verification !== "verified" && s.push("제품과 고객의 연결 근거를 검증해주세요."),
            (Array.isArray(t) ? t.filter((a) => L(a) && E(a.fact) && E(a.source)) : []).some(
              (a) => r.fit.sourceIds.includes(E(a.source, 250)) || r.fit.sourceIds.includes(E(a.id, 250)),
            ) || s.push("기존 공식 제품 사실·출처와 일치하는 sourceIds를 입력해주세요."),
            r.flow.some((a) => !a.text) && s.push("5단계 전개를 모두 작성해주세요."),
            (r.quality.claimReview !== "pass" || r.quality.duplicateReview !== "pass") &&
              s.push("표현 검수와 중복 검수를 완료해주세요."),
            r.quality.humanConfirmed !== !0 && s.push("검증된 근거와 표현을 사용자 본인이 확인해주세요."));
          let i = Object.values(r.quality.scores).reduce((a, c) => a + c, 0);
          return (
            i < 80 && s.push("기획 품질 평가 80점 이상을 확인해주세요."),
            { ready: s.length === 0, score: i, reasons: s }
          );
